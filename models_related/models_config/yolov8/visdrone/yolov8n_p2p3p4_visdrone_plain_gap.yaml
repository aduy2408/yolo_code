# YOLOv8n VisDrone P2/P3/P4 plain neck with GAP ChannelAttention before Detect.

nc: 10
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, RepC2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, RepC2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, RepC2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, RepC2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, RepC2f, [512]]              # Layer 12 (P4, stride 16)

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, RepC2f, [256]]              # Layer 15 (P3, stride 8)

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, RepC2f, [128]]              # Layer 18 (P2, stride 4)

  - [18, 1, ChannelAttention, []]       # Layer 19 (P2 GAP Attention)
  - [15, 1, ChannelAttention, []]       # Layer 20 (P3 GAP Attention)
  - [12, 1, ChannelAttention, []]       # Layer 21 (P4 GAP Attention)
  - [[19, 20, 21], 1, Detect, [nc]]     # Detect on P2, P3, P4
