# YOLOv8n TinyPerson P3/P4/P5 baseline fixed-Haar V2 frequency-sampling run.
# The canonical C2f P3-P5 baseline is preserved; Mosaic is a runner setting.

nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, FreqDownV2, [256]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, FreqDownV2, [512]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, FreqDownV2, [1024]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, FreqUpV2, []]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, FreqUpV2, []]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, FreqDownV2, [256]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, FreqDownV2, [512]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[15, 18, 21], 1, Detect, [nc]]
