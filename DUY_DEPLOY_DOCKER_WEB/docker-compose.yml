services:
  duy-deploy-web:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-duy-yolo-pytorch:jetpack6}
    image: ${RUNTIME_TAG:-duy-deploy-web:jetpack6}
    runtime: nvidia
    ipc: host
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      DUY_WEB_DISPLAY_CONF: ${DUY_WEB_DISPLAY_CONF:-0.3}
      DUY_WEB_REGISTRY: /config/models.json
      DUY_WEB_MODEL_ROOT: /models
      DUY_WEB_OUTPUT_ROOT: /tmp/duy_deploy_outputs
      DUY_WEB_PRELOAD_MODELS: "1"
      DUY_WEB_DEVICE: ${DUY_WEB_DEVICE:-0}
    ports:
      - "${DUY_WEB_PORT:-8000}:8000"
    volumes:
      - ${DUY_WEB_MODELS_DIR:-./models}:/models:ro
      - ${DUY_WEB_REGISTRY_FILE:-./models.json}:/config/models.json:ro
      - ${DUY_WEB_OUTPUT_DIR:-./runtime_outputs}:/tmp/duy_deploy_outputs
    restart: unless-stopped
