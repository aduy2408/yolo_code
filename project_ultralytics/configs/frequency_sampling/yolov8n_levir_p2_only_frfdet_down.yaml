# YOLOv8n LEVIR-Ship P2-only exact FRFDet IBS-D downsampling ablation.
# Only the downsamplers differ from the standard P2 topology. Upsampling uses
# nearest-neighbor interpolation to isolate the FRFDet IBS-D contribution.

nc: 1
p2_offset_regression: false
scale: n
scales: {n: [0.33, 0.25, 1024]}

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, FRFDetIBSDown, [256]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, FRFDetIBSDown, [512]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, FRFDetIBSDown, [1024]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]
  - [[18], 1, Detect, [nc]]
