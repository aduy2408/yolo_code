# TPH-YOLOv5 nano-depth profile
#
# Derived from the original upstream TPH-YOLOv5 architecture:
#   models/yolov5l-xs-tph.yaml
#   upstream commit 052dfeb375e51756f17e9ca4f96b7e3e3a7cf3c4
#
# This is not the official yolov5l-xs-tph model. It is a custom scaled
# variant that keeps the original C3STR TPH head and uses nano depth with a
# width profile that remains valid in the unmodified upstream parser.
#
# The upstream C3STR implementation sets attention heads to c_ // 32. A
# width_multiple of 0.25 makes the P2 C3STR hidden width 16 and therefore
# produces zero attention heads. width_multiple 0.50 is the smallest
# unmodified-upstream-safe profile because the P2 hidden width is 32 and uses
# one attention head.

nc: 80
depth_multiple: 0.33
width_multiple: 0.50
anchors: 4

# Original TPH-YOLOv5 backbone, scaled by depth_multiple/width_multiple.
backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]]]

# Original TPH-YOLOv5 neck and Transformer Prediction Head path.
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],
   [-1, 3, C3, [256, False]],

   [-1, 1, Conv, [128, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 2], 1, Concat, [1]],
   [-1, 2, C3STR, [128, False]],

   [-1, 1, Conv, [128, 3, 2]],
   [[-1, 18, 4], 1, Concat, [1]],
   [-1, 2, C3STR, [256, False]],

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 14, 6], 1, Concat, [1]],
   [-1, 2, C3STR, [512, False]],

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 10], 1, Concat, [1]],
   [-1, 2, C3STR, [1024, False]],

   [[21, 24, 27, 30], 1, Detect, [nc, anchors]]]
