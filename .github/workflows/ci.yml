name: Static and orchestration CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  static-smoke:
    name: static-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile project-owned Python
        run: |
          python -m py_compile \
            utils/marimo_client.py \
            utils/marimo_ops.py \
            utils/marimo_ci.py \
            DUY_DEPLOY/docker/pytorch_jetson/export_onnx.py \
            DUY_DEPLOY/docker/pytorch_jetson/export_engine.py \
            DUY_DEPLOY/docker/pytorch_jetson/evaluate_ultralytics.py \
            DUY_DEPLOY/docker/pytorch_jetson/evaluate_ultralytics_tinyperson.py

      - name: Check shell entrypoints
        run: |
          bash -n scripts/run_marimo_workflow.sh
          bash -n scripts/run_jetson_workflow.sh

      - name: Run orchestration tests
        run: python -m unittest tests.test_marimo_ops
