# YOLOv8n LEVIR paired fixed-Haar frequency sampling with P2/P3/P4/P5 detector levels.
# This project-owned config uses the canonical P2 pyramid topology because the
# historical yolov8n_p2_levir_baseline.yaml path is not present in this checkout.

nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, FreqDown, [256]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, FreqDown, [512]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, FreqDown, [1024]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, FreqUp, []]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, FreqUp, []]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, FreqUp, []]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]

  - [-1, 1, FreqDown, [256]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, FreqDown, [512]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, FreqDown, [1024]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[18, 21, 24, 27], 1, Detect, [nc]]
