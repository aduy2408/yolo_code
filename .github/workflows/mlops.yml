name: MLOps training, evaluation, and export

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Remote operation"
        required: true
        type: choice
        options: [train, evaluate, export, evaluate_jetson, export_jetson, jetson_pipeline]
      marimo_environment:
        description: "GitHub Environment owning this user's Marimo URL and token"
        required: true
        type: string
      marimo_repo:
        description: "Checkout path to bootstrap on the Marimo server"
        required: true
        default: "/marimo/yolo_code"
        type: string
      data_root:
        description: "Dataset root on Marimo"
        required: false
        default: "/marimo/LevirShip/LevirShipData"
        type: string
      dataset_root:
        description: "Dataset preparation root on Marimo"
        required: false
        default: "/marimo/yolo_code/datasets/ci"
        type: string
      dataset_yaml:
        description: "Optional existing dataset YAML; train prepares it when empty"
        required: false
        default: ""
        type: string
      dataset:
        description: "Dataset key"
        required: true
        default: "levirship"
        type: choice
        options: [levirship, varroa, tinyperson]
      hf_repo_id:
        description: "Task-specific Hugging Face dataset repository"
        required: false
        default: "duyle2408/ci-oacp-smoke-runs"
        type: string
      split_seed:
        description: "Dataset split seed"
        required: false
        default: "42"
        type: string
      epochs:
        description: "Training epochs"
        required: false
        default: "1"
        type: string
      min_test_map50:
        description: "Optional minimum test mAP50 quality gate"
        required: false
        default: ""
        type: string
      min_test_map50_95:
        description: "Optional minimum test mAP50-95 quality gate"
        required: false
        default: ""
        type: string
      image_size:
        description: "Image size"
        required: false
        default: "512"
        type: string
      batch_size:
        description: "Batch size"
        required: false
        default: "8"
        type: string
      workers:
        description: "Data-loader workers"
        required: false
        default: "4"
        type: string
      checkpoint:
        description: "Checkpoint path on Marimo for evaluate/export"
        required: false
        type: string
      formats:
        description: "Export formats, space-separated"
        required: false
        default: "onnx"
        type: string
      precision:
        description: "Jetson inference/export precision"
        required: false
        default: "fp16"
        type: choice
        options: [fp32, fp16]
      splits:
        description: "Jetson evaluation splits, space-separated"
        required: false
        default: "val test"
        type: string
      hf_path:
        description: "Checkpoint file path inside the Hugging Face dataset repo"
        required: false
        default: "runs/yolov9t_oacp_seed43/weights/best.pt"
        type: string
      jetson_repo:
        description: "Existing deployment checkout path on Jetson"
        required: false
        default: "/home/ait01/jetson_deployment_benchmark"
        type: string
      jetson_data_root:
        description: "Dataset root mounted on Jetson"
        required: false
        default: "/home/ait01/jetson_seed42_benchmark/data"
        type: string
      jetson_image:
        description: "Jetson PyTorch/Ultralytics Docker image"
        required: false
        default: "duy-yolo-pytorch:jetpack6"
        type: string
      model_kind:
        description: "Model artifact used by Jetson evaluation"
        required: false
        default: "engine"
        type: choice
        options: [pt, onnx, engine]
      model_name:
        description: "Model filename under the Jetson output directory"
        required: false
        default: ""
        type: string

jobs:
  remote-mlops:
    if: ${{ inputs.operation != 'export_jetson' && inputs.operation != 'evaluate_jetson' && inputs.operation != 'jetson_pipeline' }}
    name: ${{ inputs.operation }} on Marimo
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    permissions:
      contents: read
    environment: ${{ inputs.marimo_environment }}
    env:
      MARIMO_URL: ${{ vars.MARIMO_URL }}
      MARIMO_TOKEN: ${{ secrets.MARIMO_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4

      - name: Validate connection and inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MARIMO_URL"
          test -n "$MARIMO_TOKEN"
          python -c "import requests"

      - name: Bootstrap and run on Marimo
        shell: bash
        env:
          MLOPS_CONFIG_JSON: ${{ toJSON(inputs) }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(os.environ["MLOPS_CONFIG_JSON"])
          config["repo"] = config["marimo_repo"]
          config["python"] = "/tmp/uv-venv/bin/python"
          config["poll_seconds"] = 60
          config["expected_sha"] = os.environ["GITHUB_SHA"]
          config.setdefault("seed", "43")
          config.setdefault("patience", "0")
          config.setdefault("device", "0")
          config["repo_url"] = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}.git"
          )
          bootstrap = r'''
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          _repo = Path(config["repo"]).expanduser()
          _sha = config["expected_sha"]
          _repo_url = config["repo_url"]
          _repo.parent.mkdir(parents=True, exist_ok=True)
          if _repo.exists() and not (_repo / ".git").is_dir():
              raise RuntimeError(f"Refusing to replace non-Git remote path: {_repo}")
          if not _repo.exists():
              _tmp = Path(tempfile.mkdtemp(prefix=f"{_repo.name}.", dir=_repo.parent))
              try:
                  subprocess.run(
                      ["git", "clone", "--no-checkout", _repo_url, str(_tmp)],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", str(_tmp), "checkout", "--detach", _sha],
                      check=True,
                  )
                  _tmp.rename(_repo)
              except Exception:
                  subprocess.run(["rm", "-rf", str(_tmp)], check=False)
                  raise
          else:
              subprocess.run(["git", "-C", str(_repo), "fetch", "origin", _sha], check=True)
              subprocess.run(
                  ["git", "-C", str(_repo), "checkout", "--detach", _sha],
                  check=True,
              )
          sys.path.insert(0, str(_repo))
          import types
          _utils = types.ModuleType("utils")
          _utils.__path__ = [str(_repo / "utils")]
          sys.modules["utils"] = _utils
          _source = (_repo / "utils" / "marimo_ci.py").read_text()
          exec(compile(_source, str(_repo / "utils" / "marimo_ci.py"), "exec"), globals())
          '''
          remote = "config = " + repr(config) + "\n" + bootstrap
          Path("marimo-workflow-evidence").mkdir()
          Path("marimo-workflow-evidence/remote_entrypoint.py").write_text(remote)
          Path("/tmp/marimo_ci_remote.py").write_text(remote)
          PY
          python -m utils.marimo_run --file /tmp/marimo_ci_remote.py

      - name: Upload local workflow evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: marimo-${{ inputs.operation }}-${{ github.run_id }}
          path: |
            marimo-workflow-evidence/remote_entrypoint.py
          if-no-files-found: ignore
          retention-days: 14

  jetson-mlops:
    if: ${{ inputs.operation == 'export_jetson' || inputs.operation == 'evaluate_jetson' || inputs.operation == 'jetson_pipeline' }}
    name: ${{ inputs.operation }} on Jetson
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    permissions:
      contents: read
    environment: ${{ inputs.marimo_environment }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      JETSON_HOST: ${{ vars.JETSON_HOST }}
      JETSON_USER: ${{ vars.JETSON_USER }}
      JETSON_SSH_KEY: ${{ secrets.JETSON_SSH_KEY }}
      HF_REPO_ID: ${{ inputs.hf_repo_id }}
      HF_PATH: ${{ inputs.hf_path }}
      JETSON_REPO: ${{ inputs.jetson_repo }}
      JETSON_DATA_ROOT: ${{ inputs.jetson_data_root }}
      JETSON_IMAGE: ${{ inputs.jetson_image }}
      DATASET: ${{ inputs.dataset }}
      IMAGE_SIZE: ${{ inputs.image_size }}
      OPERATION: ${{ inputs.operation }}
      PRECISION: ${{ inputs.precision }}
      MODEL_KIND: ${{ inputs.model_kind }}
      MODEL_NAME: ${{ inputs.model_name }}
      SPLITS: ${{ inputs.splits }}
      RUN_DIR: jetson-${{ github.run_id }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4

      - name: Validate Jetson credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_REPO_ID"
          test -n "$HF_PATH"
          test -n "$JETSON_HOST"
          test -n "$JETSON_USER"
          key_path="$RUNNER_TEMP/jetson_key"
          printf '%s\n' "$JETSON_SSH_KEY" > "$key_path"
          chmod 600 "$key_path"
          test -s "$key_path"
          echo "JETSON_SSH_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Transfer, export, and evaluate on Jetson
        shell: bash
        run: scripts/run_jetson_workflow.sh

      - name: Upload Jetson artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jetson-${{ inputs.operation }}-${{ github.run_id }}
          path: jetson-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
