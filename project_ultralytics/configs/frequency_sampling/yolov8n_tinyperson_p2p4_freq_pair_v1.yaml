# YOLOv8n TinyPerson P2/P3/P4 fixed-Haar frequency-sampling run.
# The existing TinyPerson RepC2f P2/P3/P4 topology is preserved; Mosaic is a runner setting.

nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, RepC2f, [128, True]]
  - [-1, 1, FreqDown, [256]]
  - [-1, 6, RepC2f, [256, True]]
  - [-1, 1, FreqDown, [512]]
  - [-1, 6, RepC2f, [512, True]]
  - [-1, 1, FreqDown, [1024]]
  - [-1, 3, RepC2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, FreqUp, []]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, RepC2f, [512]]
  - [-1, 1, FreqUp, []]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, RepC2f, [256]]
  - [-1, 1, FreqUp, []]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, RepC2f, [128]]
  - [[18, 15, 12], 1, Detect, [nc]]
